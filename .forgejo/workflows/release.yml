name: Publish release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and publish
        required: true
        type: string

jobs:
  release:
    runs-on: linux-amd64
    container:
      image: code.hosaka.cc/hosaka/okonomi/ci:0.2.0
      env:
        FORGEJO_URL: https://code.hosaka.cc

    steps:
      - name: Resolve the tag
        id: tag
        run: |
          set -eu
          tag="${INPUT_TAG:-}"
          [ -n "$tag" ] || tag="${{ forgejo.ref_name }}"
          case "$tag" in
            v*) ;;
            *) echo "Not a release tag: $tag" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> $FORGEJO_OUTPUT
          echo "Releasing $tag"
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Checkout repository
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Cache Gradle
        uses: https://code.forgejo.org/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: okonomi-gradle-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: okonomi-gradle-

      - name: Cache dictionary archives
        uses: https://code.forgejo.org/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/archives
          key: okonomi-data-v1

      # Fail before building rather than after: a missing value otherwise
      # surfaces as a debug-signed APK that looks like a release.
      - name: Check signing credentials are present
        run: |
          set -eu
          missing=""
          for name in OKONOMI_KEYSTORE_BASE64 OKONOMI_KEYSTORE_PASSWORD OKONOMI_KEY_ALIAS; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Missing repository secrets or variables:$missing" >&2
            exit 1
          fi
        env:
          OKONOMI_KEYSTORE_BASE64: ${{ secrets.OKONOMI_KEYSTORE_BASE64 }}
          OKONOMI_KEYSTORE_PASSWORD: ${{ secrets.OKONOMI_KEYSTORE_PASSWORD }}
          OKONOMI_KEY_ALIAS: ${{ vars.OKONOMI_KEY_ALIAS }}

      # Outside the workspace so it cannot be picked up by a build input or
      # left behind in an artifact.
      - name: Restore the keystore
        run: |
          set -eu
          umask 077
          printf '%s' "${{ secrets.OKONOMI_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks
          test -s /tmp/release.jks

      - name: Build the signed APK
        env:
          OKONOMI_KEYSTORE_FILE: /tmp/release.jks
          OKONOMI_KEYSTORE_PASSWORD: ${{ secrets.OKONOMI_KEYSTORE_PASSWORD }}
          OKONOMI_KEY_ALIAS: ${{ vars.OKONOMI_KEY_ALIAS }}
        run: ./gradlew --stacktrace :androidApp:assembleRelease

      - name: Verify the version and the signer
        id: apk
        run: |
          set -eu
          tag="${{ steps.tag.outputs.tag }}"
          expected="${tag#v}"
          actual=$(sed -n 's/^app = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          if [ "$actual" != "$expected" ]; then
            echo "Tag $tag does not match app version $actual in gradle/libs.versions.toml" >&2
            exit 1
          fi
          src=$(find androidApp/build/outputs/apk/release -name '*.apk' | head -1)
          apk="/tmp/okonomi-$tag.apk"
          cp "$src" "$apk"
          apksigner verify --print-certs "$apk" | grep -i 'DN:' | head -1
          if apksigner verify --print-certs "$apk" | grep -qi 'CN=Android Debug'; then
            echo "Refusing to publish a debug-signed APK" >&2
            exit 1
          fi
          echo "apk=$apk" >> $FORGEJO_OUTPUT

      - name: Publish the Forgejo release
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -eu
          tag="${{ steps.tag.outputs.tag }}"
          apk="${{ steps.apk.outputs.apk }}"
          # Tags cut before changie have no notes file and publish without a body.
          notes=".changes/$tag.md"
          body=""
          if [ -f "$notes" ]; then
            body=$(sed '1{/^## /d}' "$notes" | awk 'NF { started = 1 } started')
          else
            echo "::warning::No notes file $notes for $tag; publishing without a body."
          fi

          # all forges get the same release
          jq -n --arg tag "$tag" --arg name "okonomi $tag" --arg body "$body" \
            '{tag_name: $tag, name: $name, body: $body}' > /tmp/release.json

          forgejo() {
            curl -sS --fail-with-body \
              --header "Authorization: token $TOKEN" \
              "$@"
          }

          id=$(forgejo --request POST \
            --header "Content-Type: application/json" \
            --data @/tmp/release.json \
            "$FORGEJO_URL/api/v1/repos/$FORGEJO_REPOSITORY/releases" | jq -r .id)
          echo "Created release $id"

          forgejo --request POST \
            --form "attachment=@$apk" \
            "$FORGEJO_URL/api/v1/repos/$FORGEJO_REPOSITORY/releases/$id/assets?name=$(basename "$apk")" > /dev/null
          echo "Attached $(basename "$apk")"

      - name: Publish the GitHub release
        env:
          TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          REPO: hosaka/okonomi
        run: |
          set -eu
          if [ -z "$TOKEN" ]; then
            echo "::warning::No GH_RELEASE_TOKEN secret; not publishing to github.com/$REPO."
            exit 0
          fi
          tag="${{ steps.tag.outputs.tag }}"
          apk="${{ steps.apk.outputs.apk }}"

          # The push mirror may not have synced the tag yet, and GitHub needs it
          # before a release can point at it.
          remote_url="https://x-access-token:$TOKEN@github.com/$REPO.git"
          local_commit=$(git rev-parse "$tag^{commit}")
          remote_commit=$(git ls-remote "$remote_url" "refs/tags/$tag^{}" | cut -f1)
          if [ -z "$remote_commit" ]; then
            # A shallow checkout cannot push history GitHub has not seen yet.
            git fetch --quiet --unshallow origin || true
            git push --quiet "$remote_url" "refs/tags/$tag"
            echo "Pushed $tag to $REPO"
          elif [ "$remote_commit" != "$local_commit" ]; then
            echo "$tag on $REPO is $remote_commit, here it is $local_commit" >&2
            exit 1
          fi

          github() {
            curl -sS --fail-with-body \
              --header "Authorization: Bearer $TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          id=$(github --request POST --data @/tmp/release.json \
            "https://api.github.com/repos/$REPO/releases" | jq -r .id)
          echo "Created GitHub release $id"

          github --request POST \
            --header "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@$apk" \
            "https://uploads.github.com/repos/$REPO/releases/$id/assets?name=$(basename "$apk")" > /dev/null
          echo "Attached $(basename "$apk") on GitHub"

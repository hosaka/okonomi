name: PR checks

on:
  pull_request:

jobs:
  test:
    runs-on: linux-amd64
    if: "!contains(forgejo.event.pull_request.title, '[skip ci]')"
    container:
      image: code.hosaka.cc/hosaka/okonomi/ci:0.2.0

    steps:
      - name: Checkout repository
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Gradle
        uses: https://code.forgejo.org/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: okonomi-gradle-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: okonomi-gradle-

      # Deliberately no assemble task. Packaging is the only thing that needs
      # the dictionary, so these checks never download a source archive and
      # never build the 175 MB database -- see the note in README.md.
      - name: Tests, lint and compilation
        run: |
          ./gradlew --stacktrace \
            :tools:dictgen:test \
            :shared:testAndroidHostTest \
            :shared:verifySqlDelightMigration \
            :shared:compileKotlinIosArm64 \
            :shared:compileTestKotlinIosSimulatorArm64 \
            :androidApp:compileDebugKotlin \
            :androidApp:compileDebugAndroidTestKotlin \
            :androidApp:lintDebug

      # A dry-run batch parses every pending fragment.
      - name: Pending release notes
        if: ${{ !cancelled() }}
        run: |
          set -eu
          if ! ls .changes/unreleased/*.yaml >/dev/null 2>&1; then
            echo "::notice::No release notes pending in .changes/unreleased; nothing to check."
            exit 0
          fi
          notes=$(mktemp)
          changie batch auto --dry-run > "$notes"
          cat "$notes"
          # Not piped from changie: without pipefail its failure would be lost.
          play="$(mktemp -d)/play.txt"
          sh .forgejo/scripts/release-notes.sh play - "$play" < "$notes"
          # Fragments are pending, so no Play text means the bullets were not
          # recognised (a changed changeFormat, say) and the release would
          # ship a blank "What's new".
          if [ ! -s "$play" ]; then
            echo "::error::The pending release notes produced no Play text; check changeFormat in .changie.yaml against release-notes.sh." >&2
            exit 1
          fi
          body=$(sh .forgejo/scripts/release-notes.sh body "$notes")
          case "$body" in
            "") echo "::error::The pending release notes produced an empty release body." >&2; exit 1 ;;
            "## "*) echo "::error::The release body still starts with the version heading; check versionFormat in .changie.yaml against release-notes.sh." >&2; exit 1 ;;
          esac
          echo "Pending release notes batch cleanly, fit Play's limit and give a release body."

      - name: Assert no dictionary sources were fetched
        run: |
          if [ -d data/archives ]; then
            echo "PR checks must not fetch dictionary sources, but data/archives exists:" >&2
            ls -la data/archives >&2
            exit 1
          fi
          echo "No dictionary sources fetched, as intended."

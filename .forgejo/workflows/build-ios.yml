name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: linux-amd64
    if: "!startsWith(forgejo.event.head_commit.message, 'chore(release): v')"
    steps:
      - name: Explain what is missing
        run: |
          cat <<'MSG'
          No macOS runner is registered, so the iOS app cannot be built here.

          When a macOS runner exists, replace this job with roughly:
            runs-on: macos-arm64
            - xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp \
                -configuration Debug -sdk iphonesimulator -arch arm64 \
                CODE_SIGNING_ALLOWED=NO build
          MSG
